const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let down=null;
cv.addEventListener('pointerdown',function(e){down=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',function(e){
 if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
 const r=cv.getBoundingClientRect();
 mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
 ray.setFromCamera(mv,cam);
 const roots=Object.keys(C).map(function(k){return C[k].root});
 const hits=ray.intersectObjects(roots,true);
 let found=null;
 for(const h of hits){let o=h.object;while(o&&!o.userData.botId)o=o.parent;if(o&&o.userData.botId){found=o.userData.botId;break}}
 showCard(found)});
function showCard(b){
 const card=$('card');sel=b;
 if(!b){card.style.display='none';return}
 const s=S.bots[b]||{status:'idle',step:'',time:0},r=S.routines[b]||[],ch=S.chat[b],ok=ch&&/^(grokbot|https):\/\//.test(ch);
 const meta=teamOf(b);
 card.innerHTML='<span class="x" id="cx">✕</span><b>'+esc(b)+'</b> · '+esc(s.status)+
  '<div>'+esc(s.step||'')+'</div><div class="mt">'+esc(ago(s.time))+' · '+(C[b]?esc(C[b].room||''):'')+'</div>'+
  (r.length?'<ul>'+r.map(function(x){return '<li>'+esc(typeof x==='string'?x:(x.name||JSON.stringify(x)))+'</li>'}).join('')+'</ul>':'')+
  (ok?'<a href="'+esc(ch)+'">Open chat →</a>':'');
 card.style.display='block';$('cx').onclick=function(){showCard(null)}}

 ctl.autoRotate=false;lastUser=performance.now()+1e9;
 ctl.target.set(c.x,.8,c.z);cam.position.set(c.x+4.5,3.6,c.z+5.2);ctl.update()};

  $('ureset').textContent=u.resets_at?'resets '+String(u.resets_at).slice(0,10):'';

 if(sel&&$('card').style.display==='block')showCard(sel)}
