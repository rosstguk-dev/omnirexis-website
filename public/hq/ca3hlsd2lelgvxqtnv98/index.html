<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>HQ</title>
<style>
:root{--navy:#0b1a3a;--navy2:#13265a;--ink:#eef3ff;--mute:#9fb0d8;--accent:#4f8cff}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#081229;color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--navy)}
h1{font-size:18px;margin:0}h1 span{color:var(--accent)}#conn{font-size:12px;color:var(--mute)}
main{padding:0 10px 30px;max-width:1100px;margin:auto}
.panel{background:var(--navy2);border-radius:12px;padding:10px 14px;margin:10px 0}
.bar{height:12px;background:#0a1430;border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#14C16F,#F59312);width:0}
.ulist{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute)}
#wrap{position:relative}canvas{width:100%;display:block;image-rendering:pixelated;border-radius:10px;background:#2a2238;touch-action:manipulation}
#card{position:absolute;left:8px;right:8px;bottom:8px;max-width:340px;background:rgba(11,26,58,.96);border:2px solid var(--accent);border-radius:10px;padding:10px 12px;display:none;font-size:13px}
#card b{font-size:15px}#card .x{float:right;cursor:pointer;color:var(--mute)}#card ul{margin:4px 0;padding-left:16px;color:var(--mute);font-size:12px}#card a{color:var(--accent)}
</style></head><body>
<header><h1>Omnirexis <span>HQ</span></h1><div id="conn">connecting…</div></header>
<main>
<section class="panel" id="usage"><b>Usage</b> <span id="upct">–</span> <span id="ureset" style="color:var(--mute);font-size:12px"></span><div class="bar"><i id="ubar"></i></div><div class="ulist" id="ulist"></div></section>
<div id="wrap"><canvas id="c" width="640" height="448"></canvas><div id="card"></div></div>
</main>
<script>

var TOPIC="hq-IDL7DXoYw-rxAk2P_fHi-wkK";
var FLOORS=["Ops","Sales","Brand & Web","Money","Life"];
var S={roster:[],groups:{},chat:{},looks:{},routines:{},bots:{},usage:null,seen:{}};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ingest(o){
 if(!o||typeof o!=="object")return;
 if(o.bot&&o.status!==undefined&&o.step!==undefined){var t=o.time||o._t||Date.now()/1000;var p=S.bots[o.bot];if(!p||t>=p.time)S.bots[o.bot]={status:String(o.status),step:String(o.step),time:t};}
 if(Array.isArray(o.roster))S.roster=o.roster.slice();
 if(o.groups&&typeof o.groups==="object")S.groups=o.groups;
 if(o.chat&&typeof o.chat==="object")S.chat=o.chat;
 if(o.looks&&typeof o.looks==="object")S.looks=o.looks;
 if(o.routines&&typeof o.routines==="object")S.routines=o.routines;
 if(o.type==="usage")S.usage=o;
}
function handleLine(line){
 var m;try{m=typeof line==="string"?JSON.parse(line):line}catch(e){return}
 if(!m||m.event!=="message"||!m.message||S.seen[m.id])return;S.seen[m.id]=1;
 var o;try{o=JSON.parse(m.message)}catch(e){return}
 if(o&&typeof o==="object"&&o.bot&&!o.time)o._t=m.time;
 ingest(o);
}
function groupOf(b){for(var g in S.groups){if((S.groups[g]||[]).indexOf(b)>=0)return g}return "Other"}
function ago(t){if(!t)return "no updates yet";var d=Math.max(0,Date.now()/1000-t);var s=new Date(t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});return s+" · "+(d<60?"just now":d<3600?Math.round(d/60)+"m ago":Math.round(d/3600)+"h ago")}
function allBots(){var a=S.roster.slice();Object.keys(S.bots).forEach(function(b){if(a.indexOf(b)<0)a.push(b)});return a}
function allBots(){var a=S.roster.slice();Object.keys(S.bots).forEach(function(b){if(a.indexOf(b)<0)a.push(b)});return a}
function poll(){fetch("https://ntfy.sh/"+encodeURIComponent(TOPIC)+"/json?poll=1&since=12h").then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(t){t.split("\n").forEach(function(l){if(l.trim())handleLine(l)});render();document.getElementById("conn").textContent="live · "+new Date().toLocaleTimeString()}).catch(function(e){document.getElementById("conn").textContent="offline, retrying ("+e.message+")"})}

var W=640,H=448,cv=document.getElementById("c"),X=cv.getContext("2d");X.imageSmoothingEnabled=false;
var P={coffee:{x:560,y:96},sofa:{x:560,y:388},door:{x:30,y:410},table:{x:520,y:250}};
var C={},T0=performance.now();
function col(b){var l=S.looks[b]||{},c=String(l.colour||l.color||"").replace("#","");return /^[0-9a-fA-F]{6}$/.test(c)?"#"+c:"#1E86FC"}
function deskOf(i){var c=i%5,r=Math.floor(i/5);return{x:50+c*76,y:78+r*84}}
function aisle(y){return Math.min(H-24,Math.round((y-78)/84)*84+78+34)}
function route(c,tx,ty){var a=aisle(c.y),b=aisle(ty);c.path=[{x:c.x,y:a},{x:440,y:a},{x:440,y:b},{x:tx,y:b},{x:tx,y:ty}]}
function meet(){var res={},n=0,ord=Object.keys(S.groups).sort(function(a,b){return(b==="Ops")-(a==="Ops")});
 for(var k=0;k<ord.length;k++){var w=(S.groups[ord[k]]||[]).filter(function(b){return(S.bots[b]||{}).status==="working"});if(w.length>=2){w.forEach(function(b,i){var a=i/w.length*6.283;res[b]={x:P.table.x+Math.cos(a)*46,y:P.table.y+Math.sin(a)*34}});return res}}return res}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function plan(){var bots=allBots(),m=meet();bots.forEach(function(b,i){var d=deskOf(i),c=C[b];if(!c)c=C[b]={x:d.x,y:d.y+22,path:[],goal:"",ph:hash(b)%100};
 c.desk=d;var st=(S.bots[b]||{}).status||"idle",g,t;
 if(st==="working"&&m[b]){g="meet";t=m[b]}else if(st==="working"){g="desk";t={x:d.x,y:d.y+22}}
 else if(st==="waiting_user"){g="door";t={x:P.door.x+18+(i%4)*14,y:P.door.y-(i%2)*14}}
 else if(st==="error"){g="desk";t={x:d.x,y:d.y+22}}
 else{var s=hash(b)%2;g=s?"coffee":"sofa";var o=s?P.coffee:P.sofa;t={x:o.x-40+(hash(b+"x")%80),y:o.y+(s?24:-8)+(hash(b+"y")%16)}}
 c.st=st;if(c.goal!==g+st){c.goal=g+st;route(c,t.x,t.y)}})}
function step(c,dt){c.moving=false;if(!c.path.length){if(/coffee|sofa/.test(c.goal)&&Math.random()<dt*.15){route(c,c.x+(Math.random()*40-20),c.y)}return}
 var p=c.path[0],dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy),v=90*dt;if(d<=v){c.x=p.x;c.y=p.y;c.path.shift()}else{c.x+=dx/d*v;c.y+=dy/d*v;c.dir=dx<0?-1:1}c.moving=true}
function R(x,y,w,h,f){X.fillStyle=f;X.fillRect(Math.round(x),Math.round(y),w,h)}
function room(){R(0,0,W,H,"#3b3350");for(var y=40;y<H;y+=16)for(var x=0;x<W;x+=16)if((x+y)/16%2)R(x,y,16,16,"#352e49");
 R(0,0,W,40,"#5a4f7a");R(0,36,W,4,"#2a2238");
 R(150,6,180,28,"#eee");R(152,8,176,24,"#fff");X.fillStyle="#4f8cff";X.font="bold 10px monospace";X.fillText("PLAN: ship it",160,22);R(260,14,40,2,"#e55");R(260,20,30,2,"#14C16F");
 R(470,40,170,104,"#4a3f3a");R(480,44,150,18,"#9a8a7a");R(490,46,14,14,"#333");R(492,40,10,8,"#666");R(560,46,18,14,"#ddd");R(600,48,10,12,"#c33");X.fillStyle="#ffd";X.fillText("KITCHEN",540,138);
 R(500,370,120,22,"#7a3b8a");R(500,360,120,12,"#5e2c6c");R(496,362,8,30,"#5e2c6c");R(616,362,8,30,"#5e2c6c");
 X.fillStyle="#5a4630";X.beginPath();X.ellipse(P.table.x,P.table.y,46,30,0,0,7);X.fill();X.fillStyle="#8a6a44";X.beginPath();X.ellipse(P.table.x,P.table.y-3,44,27,0,0,7);X.fill();X.fillStyle="#ffd";X.fillText("MEETING",P.table.x-22,P.table.y+2);
 R(0,380,10,60,"#222");R(10,382,24,56,"#b07a3a");R(28,410,3,3,"#ffd700");X.fillStyle="#ffd";X.fillText("ROSS",12,376);
 R(456,330,14,20,"#2a7");R(452,322,22,10,"#3c9")}
function desk(d,on){R(d.x-26,d.y-10,52,22,"#a07850");R(d.x-26,d.y+10,52,4,"#6b4f33");R(d.x-10,d.y-18,20,14,"#222");R(d.x-8,d.y-16,16,10,on?"#5fd0ff":"#334");R(d.x-2,d.y-4,4,4,"#222");R(d.x-8,d.y+2,16,4,"#ccc")}
function bubble(x,y,t,bg,fg){X.font="bold 10px monospace";var w=Math.min(170,X.measureText(t).width+10);x=Math.max(2,Math.min(W-w-2,x-w/2));R(x,y-14,w,14,bg);R(x+w/2-2,y,4,3,bg);X.fillStyle=fg;X.save();X.beginPath();X.rect(x,y-14,w,14);X.clip();X.fillText(t,x+5,y-4);X.restore()}
function body(b,c,t){var l=S.looks[b]||{},f=col(b),bob=(c.st==="working"&&!c.path.length)?Math.round(Math.sin(t*12+c.ph)*1.5):0,wk=c.moving?Math.round(Math.sin(t*14+c.ph)*2):0,x=Math.round(c.x),y=Math.round(c.y)+bob;
 R(x-6,y+8,12,3,"rgba(0,0,0,.3)");R(x-5,y+4+wk,4,5,"#222");R(x+1,y+4-wk,4,5,"#222");
 var sh=l.shape||"circle";X.fillStyle=f;
 if(/square|pill|cone|triangle/.test(sh)){R(x-8,y-14,16,18,f)}else if(/cloud|clover|trio|flower/.test(sh)){R(x-9,y-10,18,14,f);R(x-6,y-14,12,4,f)}else{R(x-7,y-14,14,18,f);R(x-8,y-12,16,14,f)}
 if(sh==="triangle"||sh==="cone"){R(x-4,y-18,8,4,f);R(x-2,y-20,4,2,f)}
 var e=c.dir<0?-1:0;R(x-4+e,y-9,3,3,"#fff");R(x+2+e,y-9,3,3,"#fff");R(x-3+e,y-8,1,1,"#000");R(x+3+e,y-8,1,1,"#000");
 var a=l.accessory;if(a==="glasses"){R(x-5+e,y-10,5,5,"rgba(0,0,0,.6)");R(x+1+e,y-10,5,5,"rgba(0,0,0,.6)")}if(a==="antenna"){R(x,y-22,1,8,"#ddd");R(x-1,y-24,3,3,"#F93498")}if(a==="stem"){R(x,y-19,2,5,"#14C16F");R(x+2,y-20,4,2,"#14C16F")}if(a==="bow"){R(x-6,y-18,5,4,"#F93498");R(x+1,y-18,5,4,"#F93498");R(x-1,y-17,2,2,"#c06")}
 if(c.st==="working"&&!c.path.length){R(x-7,y+1+(Math.sin(t*20)>0?-1:0),3,2,f);R(x+4,y+1+(Math.sin(t*20)>0?0:-1),3,2,f)}
 X.font="9px monospace";var n=String(b).slice(0,12),nw=X.measureText(n).width;R(x-nw/2-2,y+12,nw+4,10,"rgba(0,0,0,.55)");X.fillStyle="#fff";X.fillText(n,x-nw/2,y+20);
 var s=S.bots[b]||{};if(c.st==="working"&&!c.path.length)bubble(x,y-20,(s.step||"working").slice(0,40),"#fff","#123");
 else if(c.st==="waiting_user"&&!c.path.length)bubble(x,y-20,"?","#F59312","#fff");
 else if(c.st==="error"){bubble(x,y-20,"!","#E5484D","#fff");for(var k=0;k<3;k++){var pp=(t*0.8+k/3+c.ph/100)%1;X.fillStyle="rgba(180,180,180,"+(0.6*(1-pp))+")";X.beginPath();X.arc(x+8+pp*6,y-14-pp*22,3+pp*5,0,7);X.fill()}}}
var last=performance.now(),sel=null;
function frame(now){var dt=Math.min(.05,(now-last)/1000),t=(now-T0)/1000;last=now;room();var bots=allBots();
 bots.forEach(function(b,i){var c=C[b];desk(deskOf(i),c&&c.st==="working"&&c.goal.indexOf("desk")===0&&!c.path.length)});
 var list=bots.filter(function(b){return C[b]});list.forEach(function(b){step(C[b],dt)});list.sort(function(a,b){return C[a].y-C[b].y}).forEach(function(b){body(b,C[b],t)});
 if(sel&&C[sel]){var c=C[sel];X.strokeStyle="#4f8cff";X.lineWidth=2;X.strokeRect(c.x-12,c.y-26,24,40)}
 requestAnimationFrame(frame)}
function showCard(b){var card=document.getElementById("card");sel=b;if(!b){card.style.display="none";return}
 var s=S.bots[b]||{status:"idle",step:"",time:0},r=S.routines[b]||[],ch=S.chat[b],ok=ch&&/^(grokbot|https):\/\//.test(ch);
 card.innerHTML='<span class="x" id="cx">✕</span><b>'+esc(b)+'</b> · '+esc(s.status)+'<div>'+esc(s.step||"")+'</div><div style="color:var(--mute);font-size:11px">'+esc(ago(s.time))+' · '+esc(groupOf(b))+'</div>'+(r.length?'<ul>'+r.map(function(x){return '<li>'+esc(typeof x==="string"?x:(x.name||JSON.stringify(x)))+'</li>'}).join("")+'</ul>':'')+(ok?'<a href="'+esc(ch)+'">Open chat →</a>':'');card.style.display="block";document.getElementById("cx").onclick=function(){showCard(null)}}
cv.addEventListener("click",function(e){var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height,best=null,bd=22;
 Object.keys(C).forEach(function(b){var d=Math.hypot(C[b].x-x,C[b].y-4-y);if(d<bd){bd=d;best=b}});showCard(best)});
function render(){plan();
 var u=S.usage;if(u){var p=Number(u.total_used_pct)||0;document.getElementById("upct").textContent=p+"%";document.getElementById("ubar").style.width=Math.min(100,p)+"%";document.getElementById("ureset").textContent=u.resets_at?"resets "+u.resets_at:"";
  var pb=u.per_bot||u.bots||{};var arr=Array.isArray(pb)?pb:Object.keys(pb).map(function(k){return{bot:k,pct:pb[k]}});
  document.getElementById("ulist").innerHTML=arr.map(function(x){return '<span>'+esc(x.bot||x.name)+': '+esc(x.pct!=null?x.pct:x.used_pct)+'%</span>'}).join("")}
 if(sel&&document.getElementById("card").style.display==="block")showCard(sel)}
function demo(){var n=Date.now()/1000;ingest({roster:["Ops","Scout","Ledger","Brand","Web","Sales","Money","Life"]});ingest({groups:{Ops:["Ops","Scout","Ledger"],Sales:["Sales"],"Brand & Web":["Brand","Web"],Money:["Money"],Life:["Life"]}});
 ingest({looks:{Ops:{shape:"rounded_square",colour:"1E86FC",accessory:"glasses"},Scout:{shape:"triangle",colour:"14C16F",accessory:"antenna"},Ledger:{shape:"circle",colour:"F59312"},Brand:{shape:"flower",colour:"F93498",accessory:"bow"},Web:{shape:"hexagon",colour:"8B5CF6"},Sales:{shape:"pill",colour:"E5484D",accessory:"stem"},Money:{shape:"cloud",colour:"22C3C3"},Life:{shape:"drop",colour:"FFD23F"}}});
 ingest({routines:{Ops:["Morning briefing 08:00"],Brand:["Social post 12:00"]}});ingest({chat:{Ops:"https://example.com"}});ingest({type:"usage",total_used_pct:42,resets_at:"1 Dec",per_bot:{Ops:12,Brand:9,Scout:7}});
 var st=[["Ops","working","Triaging inbox"],["Scout","working","Researching leads"],["Ledger","idle",""],["Brand","working","Editing promo video"],["Web","error","Deploy failed"],["Sales","waiting_user","Needs approval on quote"],["Money","done","Invoices sent"],["Life","idle",""]];
 st.forEach(function(s){ingest({bot:s[0],status:s[1],step:s[2],time:n-300})})}
if(typeof document!=="undefined"&&document.getElementById){
 if(/[?&]demo=1/.test(location.search)){demo();render();document.getElementById("conn").textContent="demo data"}else{render();poll();setInterval(poll,10000)}
 setInterval(render,5000);requestAnimationFrame(frame)}
</script></body></html>
