<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>HQ</title>
<style>
:root{--navy:#0b1a3a;--navy2:#13265a;--card:#1a3070;--ink:#eef3ff;--mute:#9fb0d8;--accent:#4f8cff}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,var(--navy),#081229);color:var(--ink);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;background:rgba(11,26,58,.92);backdrop-filter:blur(6px);z-index:2}
h1{font-size:18px;margin:0}h1 span{color:var(--accent)}#conn{font-size:12px;color:var(--mute)}
main{padding:0 12px 40px;max-width:1100px;margin:auto}
.panel{background:var(--navy2);border-radius:14px;padding:12px 14px;margin:12px 0}
.bar{height:12px;background:#0a1430;border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#14C16F,#F59312);width:0}
.ulist{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute)}
.floor h2{font-size:14px;margin:0 0 8px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.desk{background:var(--card);border-radius:12px;padding:10px;position:relative;cursor:default;border-bottom:4px solid #0a1430}
.desk.link{cursor:pointer}.desk.link:hover{outline:2px solid var(--accent)}
.desk .nm{font-weight:600;font-size:13px;margin-top:4px}.desk .st{font-size:12px;color:var(--ink);opacity:.85;min-height:2.8em}.desk .tm{font-size:11px;color:var(--mute)}
.desk .rt{font-size:11px;color:var(--mute);margin:4px 0 0;padding-left:14px}
.light{position:absolute;top:10px;right:10px;width:11px;height:11px;border-radius:50%;background:#959595}
.light.working{background:#14C16F;animation:p 1.4s infinite}.light.waiting_user{background:#F59312}.light.error{background:#E5484D}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(20,193,111,.7)}70%{box-shadow:0 0 0 9px rgba(20,193,111,0)}100%{box-shadow:0 0 0 0 rgba(20,193,111,0)}}
svg.char{width:54px;height:54px;display:block}
.desk.working svg.char{animation:b 1.6s ease-in-out infinite}@keyframes b{50%{transform:translateY(-3px)}}
</style></head><body>
<header><h1>Omnirexis <span>HQ</span></h1><div id="conn">connecting…</div></header>
<main>
<section class="panel" id="usage"><b>Usage</b> <span id="upct">–</span> <span id="ureset" style="color:var(--mute);font-size:12px"></span><div class="bar"><i id="ubar"></i></div><div class="ulist" id="ulist"></div></section>
<div id="floors"></div>
</main>
<script>
var TOPIC="hq-IDL7DXoYw-rxAk2P_fHi-wkK";
var FLOORS=["Ops","Sales","Brand & Web","Money","Life"];
var S={roster:[],groups:{},chat:{},looks:{},routines:{},bots:{},usage:null,seen:{}};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ingest(o){
 if(!o||typeof o!=="object")return;
 if(o.bot&&o.status!==undefined&&o.step!==undefined){var t=o.time||o._t||Date.now()/1000;var p=S.bots[o.bot];if(!p||t>=p.time)S.bots[o.bot]={status:String(o.status),step:String(o.step),time:t};}
 if(Array.isArray(o.roster))S.roster=o.roster.slice();
 if(o.groups&&typeof o.groups==="object")S.groups=o.groups;
 if(o.chat&&typeof o.chat==="object")S.chat=o.chat;
 if(o.looks&&typeof o.looks==="object")S.looks=o.looks;
 if(o.routines&&typeof o.routines==="object")S.routines=o.routines;
 if(o.type==="usage")S.usage=o;
}
function handleLine(line){
 var m;try{m=typeof line==="string"?JSON.parse(line):line}catch(e){return}
 if(!m||m.event!=="message"||!m.message||S.seen[m.id])return;S.seen[m.id]=1;
 var o;try{o=JSON.parse(m.message)}catch(e){return}
 if(o&&typeof o==="object"&&o.bot&&!o.time)o._t=m.time;
 ingest(o);
}
function groupOf(b){for(var g in S.groups){if((S.groups[g]||[]).indexOf(b)>=0)return g}return "Other"}
function shapePath(s){var c=30,r=20,i,pts=[];
 function poly(n,rr,rot,inner){var a=[];for(i=0;i<n*(inner?2:1);i++){var ang=rot+i*Math.PI*2/(n*(inner?2:1));var R=inner&&i%2?inner:rr;a.push((c+R*Math.cos(ang)).toFixed(1)+","+(34+R*Math.sin(ang)).toFixed(1))}return '<polygon points="'+a.join(" ")+'"/>'}
 switch(s){
 case"cloud":return '<g><circle cx="20" cy="38" r="12"/><circle cx="40" cy="38" r="12"/><circle cx="30" cy="28" r="14"/><rect x="18" y="36" width="24" height="14"/></g>';
 case"rounded_square":return '<rect x="10" y="14" width="40" height="40" rx="10"/>';
 case"star4":return poly(4,23,-Math.PI/2,10);case"star6":return poly(6,22,-Math.PI/2,13);
 case"clover":return '<g><circle cx="30" cy="24" r="11"/><circle cx="20" cy="38" r="11"/><circle cx="40" cy="38" r="11"/><circle cx="30" cy="36" r="9"/></g>';
 case"bubble":return '<g><ellipse cx="30" cy="32" rx="21" ry="18"/><polygon points="18,44 14,56 28,48"/></g>';
 case"flower":return '<g>'+[0,1,2,3,4].map(function(k){var a=k*1.2566-1.57;return '<circle cx="'+(30+12*Math.cos(a)).toFixed(1)+'" cy="'+(34+12*Math.sin(a)).toFixed(1)+'" r="10"/>'}).join("")+'<circle cx="30" cy="34" r="10"/></g>';
 case"drop":return '<path d="M30 10 C30 10 50 34 50 40 A20 20 0 0 1 10 40 C10 34 30 10 30 10Z"/>';
 case"pill":return '<rect x="16" y="12" width="28" height="44" rx="14"/>';
 case"triangle":return '<polygon points="30,10 54,54 6,54"/>';
 case"pentagon":return poly(5,22,-Math.PI/2);case"hexagon":return poly(6,22,0);
 case"cone":return '<g><polygon points="30,8 50,50 10,50"/><ellipse cx="30" cy="50" rx="20" ry="6"/></g>';
 case"trio":return '<g><circle cx="18" cy="42" r="11"/><circle cx="42" cy="42" r="11"/><circle cx="30" cy="24" r="11"/></g>';
 default:return '<circle cx="30" cy="34" r="21"/>';}}
function acc(a){switch(a){
 case"glasses":return '<g fill="none" stroke="#111" stroke-width="2"><circle cx="23" cy="32" r="5"/><circle cx="37" cy="32" r="5"/><path d="M28 32h4"/></g>';
 case"antenna":return '<g stroke="#ddd" stroke-width="2"><path d="M30 12V3"/><circle cx="30" cy="3" r="3" fill="#F93498"/></g>';
 case"stem":return '<g><path d="M30 12V4" stroke="#14C16F" stroke-width="3"/><ellipse cx="35" cy="6" rx="5" ry="3" fill="#14C16F"/></g>';
 case"bow":return '<g fill="#F93498"><polygon points="30,12 20,6 20,18"/><polygon points="30,12 40,6 40,18"/><circle cx="30" cy="12" r="3"/></g>';
 default:return ""}}
function charSVG(b){var l=S.looks[b]||{};var col=/^[0-9a-fA-F]{6}$/.test(String(l.colour||l.color||"").replace("#",""))?"#"+String(l.colour||l.color).replace("#",""):"#1E86FC";
 var eyes=l.accessory==="glasses"?"":'<circle cx="23" cy="32" r="2.6" fill="#fff"/><circle cx="37" cy="32" r="2.6" fill="#fff"/>';
 return '<svg class="char" viewBox="0 0 60 60"><g fill="'+col+'" stroke="rgba(255,255,255,.25)">'+shapePath(l.shape)+'</g>'+eyes+'<path d="M25 41q5 4 10 0" stroke="#fff" stroke-width="2" fill="none"/>'+acc(l.accessory)+'</svg>'}
function ago(t){if(!t)return "no updates yet";var d=Math.max(0,Date.now()/1000-t);var s=new Date(t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});return s+" · "+(d<60?"just now":d<3600?Math.round(d/60)+"m ago":Math.round(d/3600)+"h ago")}
function allBots(){var a=S.roster.slice();Object.keys(S.bots).forEach(function(b){if(a.indexOf(b)<0)a.push(b)});return a}
function render(){
 var bots=allBots(),by={};bots.forEach(function(b){var g=groupOf(b);(by[g]=by[g]||[]).push(b)});
 var order=FLOORS.concat(Object.keys(by).filter(function(g){return FLOORS.indexOf(g)<0}));
 var h="";order.forEach(function(g){var list=by[g]||[];if(!list.length&&FLOORS.indexOf(g)<0)return;
  h+='<section class="panel floor"><h2>'+esc(g)+'</h2><div class="desks">';
  list.forEach(function(b){var st=S.bots[b]||{status:"idle",step:"",time:0};var cls=["working","waiting_user","error"].indexOf(st.status)>=0?st.status:"idle";var ch=S.chat[b];var ok=ch&&/^(grokbot|https):\/\//.test(ch);
   var r=S.routines[b]||[];
   h+='<div class="desk '+cls+(ok?' link':'')+'"'+(ok?' data-href="'+esc(ch)+'"':'')+'><span class="light '+cls+'" title="'+esc(st.status)+'"></span>'+charSVG(b)+'<div class="nm">'+esc(b)+'</div><div class="st">'+esc(st.step||st.status)+'</div><div class="tm">'+esc(ago(st.time))+'</div>'+(r.length?'<ul class="rt">'+r.map(function(x){return '<li>'+esc(typeof x==="string"?x:(x.name||JSON.stringify(x)))+'</li>'}).join("")+'</ul>':'')+'</div>'});
  h+='</div></section>'});
 document.getElementById("floors").innerHTML=h;
 var u=S.usage;if(u){var p=Number(u.total_used_pct)||0;document.getElementById("upct").textContent=p+"%";document.getElementById("ubar").style.width=Math.min(100,p)+"%";document.getElementById("ureset").textContent=u.resets_at?"resets "+u.resets_at:"";
  var pb=u.per_bot||u.bots||{};var arr=Array.isArray(pb)?pb:Object.keys(pb).map(function(k){return{bot:k,pct:pb[k]}});
  document.getElementById("ulist").innerHTML=arr.map(function(x){return '<span>'+esc(x.bot||x.name)+': '+esc(x.pct!=null?x.pct:x.used_pct)+'%</span>'}).join("")}
}
function poll(){fetch("https://ntfy.sh/"+encodeURIComponent(TOPIC)+"/json?poll=1&since=12h").then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(t){t.split("\n").forEach(function(l){if(l.trim())handleLine(l)});render();document.getElementById("conn").textContent="live · "+new Date().toLocaleTimeString()}).catch(function(e){document.getElementById("conn").textContent="offline, retrying ("+e.message+")"})}
if(typeof document!=="undefined"&&document.getElementById){document.addEventListener("click",function(e){var d=e.target.closest&&e.target.closest(".desk.link");if(d)location.href=d.getAttribute("data-href")});render();poll();setInterval(poll,10000);setInterval(render,30000)}
</script></body></html>
