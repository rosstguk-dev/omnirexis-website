name: Daily deploy (Vercel freeze batch)

# Pushes an empty "[daily-deploy] batch YYYY-MM-DD" commit to main once a day at 16:00 UK
# if anything has been merged since the last [daily-deploy] commit. Vercel builds
# production only for those commits (see scripts/vercel-ignore.sh).
# Two crons cover BST (15:00 UTC) and GMT (16:00 UTC); any scheduled run at or after 16:00 UK continues
# (GitHub often starts crons hours late), and only one batch goes out if nothing new merged in between.
# Urgent deploy: Actions > "Daily deploy" > Run workflow (skips the hour check),
# or `gh workflow run daily-deploy.yml -R rosstguk-dev/omnirexis-website`.
# After 30 Oct 2026 this workflow does nothing. Delete it whenever convenient.

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-deploy
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on UK time and freeze window
        id: gate
        run: |
          hour=$(TZ=Europe/London date +%H)
          today=$(TZ=Europe/London date +%F)
          echo "UK now: $(TZ=Europe/London date '+%F %H:%M %Z')"
          go=true
          if [[ ! "$today" < "2026-10-30" ]]; then echo "Freeze over; nothing to do."; go=false; fi
          # Tightened freeze (CoS, 23 Oct): the 23 Oct batch is the last scheduled one. From 24 Oct to
          # 29 Oct scheduled runs do nothing; only a manual workflow_dispatch (urgent fix) deploys.
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$today" > "2026-10-23" ]]; then
            echo "Scheduled batches paused 24-29 Oct; use workflow_dispatch for urgent fixes."; go=false
          fi
          # GitHub runs scheduled crons hours late (20-21 Oct ran at 19:03-20:46 UTC), so an exact
          # 16:xx check never passed and nothing deployed. Accept any scheduled run at or after 16:00 UK;
          # the "nothing new since the last [daily-deploy]" check below stops a second batch the same day.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$((10#$hour))" -lt 16 ]; then
            echo "Before 16:00 UK (hour=$hour); skipping this cron."; go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          ref: main
          fetch-depth: 200
      - name: Push [daily-deploy] commit if main changed
        if: steps.gate.outputs.go == 'true'
        run: |
          last=$(git log -1 --format=%H -F --grep='[daily-deploy]' || true)
          if [ -n "$last" ]; then n=$(git rev-list --count "$last"..HEAD); else n=$(git rev-list --count HEAD); fi
          echo "Commits since last [daily-deploy] (${last:-none}): $n"
          if [ "$n" = "0" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Nothing new; no deploy."; exit 0
          fi
          git config user.name "omnirexis-daily-deploy"
          git config user.email "ross@omnirexis.co.uk"
          git commit --allow-empty -m "[daily-deploy] batch ${{ steps.gate.outputs.today }}"
          git push origin HEAD:main
